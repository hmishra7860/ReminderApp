stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_REGISTRY: "varutik332"
  BACKEND_IMAGE: "varutik332/remindercal-backend"
  FRONTEND_IMAGE: "varutik332/remindercal-frontend"
  IMAGE_TAG: "$CI_PIPELINE_IID"
  K8S_NAMESPACE: "remindercal"

lint:backend:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff --quiet
    - cd backend
    - ruff check . --ignore B008 --fix

test:backend:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: remindercal_test
    POSTGRES_USER: rcal
    POSTGRES_PASSWORD: rcalpass
    DATABASE_URL: "postgresql+asyncpg://rcal:rcalpass@postgres:5432/remindercal_test"
  script:
    - cd backend
    - pip install -r requirements.txt pytest pytest-asyncio httpx --quiet
    - python -m pytest tests/ -v --tb=short

build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
    
    - docker build -t $BACKEND_IMAGE:$IMAGE_TAG -t $BACKEND_IMAGE:latest ./backend
    - docker push $BACKEND_IMAGE:$IMAGE_TAG
    - docker push $BACKEND_IMAGE:latest

    - docker build -t $FRONTEND_IMAGE:$IMAGE_TAG -t $FRONTEND_IMAGE:latest ./frontEnd
    - docker push $FRONTEND_IMAGE:$IMAGE_TAG
    - docker push $FRONTEND_IMAGE:latest
    - docker logout
  only:
    - main

deploy:k3s:
  stage: deploy
  image: alpine:latest
  script:
    - apk add --no-cache curl kubectl
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" > ~/.kube/config
    - export KUBECONFIG=~/.kube/config

    - kubectl create namespace $K8S_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

    - DB_URL="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    - |
      kubectl create secret generic rcal-app-secrets \
          --namespace=$K8S_NAMESPACE \
          --from-literal=POSTGRES_USER="$POSTGRES_USER" \
          --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          --from-literal=POSTGRES_DB="$POSTGRES_DB" \
          --from-literal=DATABASE_URL="$DB_URL" \
          --from-literal=JWT_SECRET="$JWT_SEC" \
          --from-literal=GF_SECURITY_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD" \
          --dry-run=client -o yaml | kubectl apply -f -

    - sed -i "s|REGISTRY_PLACEHOLDER|$DOCKER_REGISTRY|g" k8s/backend.yaml k8s/frontend.yaml
    - sed -i "s|TAG_PLACEHOLDER|$IMAGE_TAG|g" k8s/backend.yaml k8s/frontend.yaml

    - |
      kubectl apply -f k8s/database.yaml || exit 1

      kubectl apply -f k8s/backend.yaml
      kubectl rollout status deployment/backend -n $K8S_NAMESPACE --timeout=90s || {
        echo "❌ Backend rollout failed! Rolling back..."
        kubectl rollout undo deployment/backend -n $K8S_NAMESPACE
        exit 1
      }

      kubectl apply -f k8s/frontend.yaml
      kubectl rollout status deployment/frontend -n $K8S_NAMESPACE --timeout=90s || {
        echo "❌ Frontend rollout failed! Rolling back..."
        kubectl rollout undo deployment/frontend -n $K8S_NAMESPACE
        exit 1
      }

      kubectl apply -f k8s/monitoring.yaml
  only:
    - main