groups:
  - name: remindercal_alerts
    rules:

      # Backend down
      - alert: BackendDown
        expr: up{job="remindercal_backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ReminderCal backend is DOWN"
          description: "The FastAPI backend has been unreachable for more than 1 minute."

      # High CPU
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      # High Memory
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage exceeds 80% (current: {{ $value | printf \"%.1f\" }}%)."

      # High Disk
      - alert: HighDiskUsage
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage exceeds 90% (current: {{ $value | printf \"%.1f\" }}%)."

      # Slow API response
      - alert: SlowAPIResponse
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="remindercal_backend"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow API responses on ReminderCal backend"
          description: "95th percentile response time exceeds 2 seconds."
