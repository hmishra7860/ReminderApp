name: CI/CD Pipeline to K3s

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: "varutik332"
  BACKEND_IMAGE: "varutik332/remindercal-backend"
  FRONTEND_IMAGE: "varutik332/remindercal-frontend"
  IMAGE_TAG: "${{ github.run_number }}"
  K8S_NAMESPACE: "remindercal"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontEnd
          file: ./frontEnd/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubeconfig & Deploy to K3s
        id: deploy
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          export KUBECONFIG=~/.kube/config

          # 1. Ensure Namespace Exists
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # 2. Sync Kubernetes Secrets
          DB_URL="postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}"

          kubectl create secret generic rcal-app-secrets \
              --namespace=${{ env.K8S_NAMESPACE }} \
              --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
              --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              --from-literal=POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
              --from-literal=DATABASE_URL="${DB_URL}" \
              --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              --from-literal=GF_SECURITY_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
              --dry-run=client -o yaml | kubectl apply -f -

          # 3. Replace image placeholders in manifests
          sed -i "s|REGISTRY_PLACEHOLDER|${{ env.DOCKER_REGISTRY }}|g" k8s/backend.yaml k8s/frontend.yaml
          sed -i "s|TAG_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" k8s/backend.yaml k8s/frontend.yaml

          # 4. Apply Manifests with Rollout Validation
          kubectl apply -f k8s/database.yaml
          
          kubectl apply -f k8s/backend.yaml
          kubectl rollout status deployment/backend -n ${{ env.K8S_NAMESPACE }} --timeout=90s

          kubectl apply -f k8s/frontend.yaml
          kubectl rollout status deployment/frontend -n ${{ env.K8S_NAMESPACE }} --timeout=90s

          kubectl apply -f k8s/monitoring.yaml

      - name: Automated Rollback on Failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          export KUBECONFIG=~/.kube/config

          echo "❌ Deployment failed! Initiating automated rollback..."
          kubectl rollout undo deployment/backend -n ${{ env.K8S_NAMESPACE }} || true
          kubectl rollout undo deployment/frontend -n ${{ env.K8S_NAMESPACE }} || true