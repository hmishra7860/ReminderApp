stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_BACKEND: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  IMAGE_FRONTEND: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"

# ── Lint ───────────────────────────────────────────────────────────────────────
lint:backend:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff --quiet
    - ruff check backend/
  only:
    - merge_requests
    - main

# ── Test ───────────────────────────────────────────────────────────────────────
test:backend:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: remindercal_test
    POSTGRES_USER: rcal
    POSTGRES_PASSWORD: rcalpass
    DATABASE_URL: postgresql+asyncpg://rcal:rcalpass@postgres/remindercal_test
  script:
    - cd backend
    - pip install -r requirements.txt pytest pytest-asyncio httpx --quiet
    - pytest tests/ -v --tb=short
  only:
    - merge_requests
    - main

# ── Build ──────────────────────────────────────────────────────────────────────
build:backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_BACKEND" ./backend
    - docker push "$IMAGE_BACKEND"
    - docker tag "$IMAGE_BACKEND" "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
  only:
    - main

build:frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_FRONTEND" ./frontend
    - docker push "$IMAGE_FRONTEND"
    - docker tag "$IMAGE_FRONTEND" "$CI_REGISTRY_IMAGE/frontend:latest"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"
  only:
    - main

# ── Deploy ─────────────────────────────────────────────────────────────────────
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
        cd /opt/remindercal
        docker compose pull
        docker compose up -d --remove-orphans
        docker system prune -f
      EOF
  environment:
    name: production
    url: http://$DEPLOY_HOST
  only:
    - main
  when: manual
