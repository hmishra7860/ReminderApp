apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: remindercal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: REGISTRY_PLACEHOLDER/remindercal-backend:TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: TZ
              value: "Asia/Kolkata"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rcal-app-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rcal-app-secrets
                  key: JWT_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: rcal-app-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: rcal-app-secrets
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: rcal-app-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: rcal-app-secrets
                  key: SMTP_PASS
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: rcal-app-secrets
                  key: FROM_EMAIL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: remindercal
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000