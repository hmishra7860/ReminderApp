global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "alerts@remindercal.io"
  smtp_auth_username: "${SMTP_USER}"
  smtp_auth_password: "${SMTP_PASS}"
  smtp_require_tls: true
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "email-alerts"
  routes:
    - match:
        severity: critical
      receiver: "email-alerts"
      continue: true

receivers:
  - name: "email-alerts"
    email_configs:
      - to: "admin@remindercal.io"
        send_resolved: true
        html: |
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b><br/>
          Status: {{ .Status }}<br/>
          {{ .Annotations.description }}<br/><br/>
          {{ end }}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
